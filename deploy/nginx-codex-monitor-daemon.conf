server {
    listen 443 ssl http2;
    server_name codex-monitor.example.com;

    ssl_certificate /etc/letsencrypt/live/codex-monitor.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codex-monitor.example.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:4733;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_cache off;
    }
}
